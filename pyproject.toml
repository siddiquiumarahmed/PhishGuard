[project]
name = "phishguard"
version = "1.0.0"
description = "Local phishing URL analysis with explainable rules, optional threat intelligence and an optional ML model."
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
addopts = "-ra"
filterwarnings = [
    "ignore::DeprecationWarning:flask_limiter.*",
]

[tool.ruff]
line-length = 120
target-version = "py311"
extend-exclude = ["migrations/versions", "instance", ".venv"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "S", "BLE", "C4", "SIM", "RUF"]
ignore = [
    "RUF001",  # deliberate confusable characters in homoglyph tables and tests
    "RUF002",
    "RUF003",
    "SIM108",
]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["S101", "S105", "S106", "S311", "RUF012"]
"migrations/*" = ["I001", "UP"]
"scripts/*" = ["E402"]

[tool.ruff.lint.isort]
known-first-party = ["phishguard", "config"]

[tool.bandit]
exclude_dirs = ["tests", ".venv", "migrations/versions"]
